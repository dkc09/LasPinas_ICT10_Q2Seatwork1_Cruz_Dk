<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Verification System - ICT Club</title>
    

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

  
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .verification-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .badge-ict {
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 30px;
            display: inline-block;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            transition: all 0.2s ease-in-out;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }
        .btn-verify {
            background-color: #2563eb;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            font-size: 1rem;
            color: #ffffff;
            transition: all 0.2s ease-in-out;
        }
        .btn-verify:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3);
        }
        #result-area {
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

    <div class="verification-card p-4 p-md-5 w-100" style="max-width: 480px;">
        <div class="text-center mb-4">
            <span class="badge-ict mb-2">Campus ICT Club</span>
            <h3 class="fw-bold text-dark m-0">Candidate Verification</h3>
            <p class="text-muted small mt-1">Enter candidate details below to verify membership status.</p>
        </div>

    
        <div class="mb-3">
            <label for="first-name" class="form-label text-secondary fw-semibold small">FIRST NAME</label>
            <input type="text" id="first-name" class="form-control" placeholder="e.g. John" autocomplete="off">
        </div>

        <div class="mb-4">
            <label for="last-name" class="form-label text-secondary fw-semibold small">LAST NAME</label>
            <input type="text" id="last-name" class="form-control" placeholder="e.g. Doe" autocomplete="off">
        </div>

       
        <button id="verify-btn" py-click="verify_candidate" class="btn btn-verify w-100">
            Verify Membership
        </button>

        <div id="result-area" class="mt-4 p-3 text-center d-none"></div>
    </div>

  
    <script type="py" src="./main.py" config='{"packages": []}'></script>

</body>
</html>
